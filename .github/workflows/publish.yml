# Publishes projects/pipecat to npm as @getvoicify/pipecat whenever a tag
# matching v* is pushed, or when manually triggered from the Actions UI/API.
#
# Manual trigger (workflow_dispatch): lets a maintainer run this workflow
# without a new tag existing yet — e.g. to re-publish, recover from a failed
# automated run, or publish outside the normal release-please flow.
# workflow_dispatch's built-in ref picker (no custom input needed) lets the
# operator choose any branch or tag; GITHUB_REF_NAME then reflects whatever
# was selected, not necessarily a `v*` tag. Because the "Verify tag matches
# package version" step's TAG_VERSION derivation only makes sense for an
# actual tag push, that step is skipped entirely (`if: github.event_name ==
# 'push'`) on manual runs — the operator is trusted to have picked the right
# ref and to intend publishing whatever version is in
# projects/pipecat/package.json at that ref.
#
# Auth: npm OIDC "Trusted Publishing" (no long-lived NPM_TOKEN secret). The
# npm CLI (>= 11.5.1) auto-detects the GitHub Actions OIDC environment via
# actions/setup-node's `registry-url` and exchanges it for a short-lived
# publish credential at `npm publish` time. The npm version bundled with
# Node 24 on GitHub Actions runners is not guaranteed to meet this minimum
# (multiple real-world reports needed an explicit upgrade), so the "Upgrade
# npm" step below pins npm to latest before publish. `permissions.id-token:
# write` below is what makes the OIDC token available to the job.
#
# One-time manual setup (not done by this workflow): under the package's
# Settings -> Trusted Publisher on npmjs.com, configure Organization/user =
# getvoicify, Repository = getvoicify/ngx-pipecat, Workflow filename =
# publish.yml (exact, case-sensitive match), and select "npm publish" under
# Allowed actions. CONFIRMED: the package must be published at least once via
# a traditional method (e.g. `npm publish` with a token) before the Trusted
# Publisher settings become configurable — that settings page lives at
# npmjs.com/package/{name}/access, which is package-specific and does not
# exist until the package itself has been published at least once. That
# one-time manual bootstrap publish is being handled separately by the repo
# owner, outside of this workflow.
#
# Provenance: npm's docs claim that with trusted publishing + a public repo +
# a public package (all true here), provenance attestations are generated
# automatically with no `--provenance` flag needed. In practice, multiple
# real-world reports (including a linked npm/cli GitHub issue) found that
# provenance was not attached, or publish behaved unreliably, unless
# `--provenance` was passed explicitly — so this workflow does not rely on
# the documented automatic behavior and passes the flag explicitly on the
# publish step below.
#
# package.json's `repository.url` must exactly match this GitHub repository
# or trusted publishing fails at publish time with ENEEDAUTH (npm does not
# validate this when the Trusted Publisher config is saved).
#
# Publish step gotcha: never pass a path argument to `npm publish` (e.g.
# `npm publish dist/pipecat`). A bare relative path like `dist/pipecat` is
# syntactically identical to npm's `owner/repo` GitHub-shorthand package
# specifier, so npm misinterprets it as "fetch package `pipecat` from GitHub
# user/org `dist`" instead of a local filesystem path, and fails with
# EALLOWGIT ("Refusing to fetch ... Fetching packages of type \"git\" have
# been disabled"). CONFIRMED by a real failed run (tag v0.1.0). The fix is to
# `cd` into the built package directory via the step's `working-directory`
# and run a bare `npm publish` with no path argument — this is exactly what
# the repo owner's successful one-time manual bootstrap publish did. Do not
# reintroduce a path argument here.

name: Publish to npm

permissions:
  id-token: write   # Required for npm OIDC trusted publishing
  contents: read

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bunx ng test pipecat --watch=false

      - name: Build library
        run: bunx ng build pipecat

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./dist/pipecat/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match built package version ($PKG_VERSION)"
            exit 1
          fi
          echo "Tag version $TAG_VERSION matches package version $PKG_VERSION"

      - name: Publish to npm
        working-directory: dist/pipecat
        run: npm publish --provenance
