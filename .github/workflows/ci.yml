# Runs the test suite on every pull request targeting main and on every
# push to main, so branch protection has a status check that actually
# exercises the code before it merges.
#
# No separate Node.js setup is used here (unlike publish.yml): setup-node
# there exists solely to configure the npm registry OIDC ("Trusted
# Publishing") auth for `npm publish`, which this workflow never does.
# `bunx ng test` runs fine on bun alone — verified locally with `node`
# removed from PATH entirely.

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bunx ng test pipecat --watch=false
